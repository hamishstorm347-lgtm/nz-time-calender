<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NZ Markets Calendar</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#666;--grey:#f1f1f1;--line:#ddd;--alert:#fde2e0;--alertfg:#9c0006;--accent:#1f3864;--chip:#e8eefc}
@media (prefers-color-scheme:dark){:root{--bg:#151515;--fg:#eee;--muted:#aaa;--grey:#222;--line:#333;--alert:#4a1f1f;--alertfg:#ffb3ad;--accent:#9db9ff;--chip:#2a3550}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg);padding:env(safe-area-inset-top) 0 40px}
header{padding:14px 14px 6px}
h1{font-size:20px;margin:0 0 2px;color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.stats{display:flex;gap:8px;flex-wrap:wrap;padding:6px 14px}
.stat{background:var(--grey);border-radius:8px;padding:6px 10px;font-size:13px}
.stat b{font-size:17px;display:block}
.controls{display:flex;gap:8px;flex-wrap:wrap;padding:8px 14px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
select,input,button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);max-width:100%}
.ev{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ev.shade{background:var(--grey)}
.ev.first{border-top:2px solid var(--muted)}
.ev.alert{background:var(--alert)}
.ev.past{opacity:.55}
.when{font-weight:600}.when small{display:block;font-weight:400;color:var(--muted)}
.cd{display:block;margin-top:2px;font-size:12px;font-weight:600}
.alert .cd{color:var(--alertfg)}
.title{font-weight:600}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:1px 8px;margin:2px 4px 0 0;font-size:12px}
.hi{color:#c00000;font-weight:700}
details{margin-top:4px;font-size:13px}summary{cursor:pointer;color:var(--accent)}
.star{color:#e0a800}
.empty,.err{padding:20px 14px;color:var(--muted)}
.err{color:#c00000}
@media(max-width:520px){.ev{grid-template-columns:88px 1fr}}
</style>
</head>
<body>
<header>
  <h1>NZ Markets, Data &amp; Crypto Calendar</h1>
  <div class="sub" id="updated">Loading...</div>
  <div class="sub">All times New Zealand. Dates marked Estimated can move &mdash; check the source. Not financial advice.</div>
</header>
<div class="stats">
  <div class="stat"><b id="sAlert">-</b>in next 24h</div>
  <div class="stat"><b id="s7">-</b>next 7 days</div>
  <div class="stat"><b id="sHigh">-</b>high impact (7d)</div>
  <div class="stat"><b id="sNext">-</b>next event</div>
</div>
<div class="controls">
  <select id="range"><option value="7">Next 7 days</option><option value="30" selected>Next 30 days</option><option value="90">Next 90 days</option><option value="9999">Whole year</option><option value="-30">Last 30 days</option></select>
  <select id="cat"><option value="">All categories</option></select>
  <select id="imp"><option value="">All impact</option><option>High</option><option>Med</option><option>Low</option></select>
  <select id="mode"><option value="all">All events</option><option value="mine">My holdings + market-wide</option><option value="only">My holdings only</option></select>
  <input id="hold" placeholder="My tickers: BTC, ETH, NVDA" size="22">
  <input id="q" placeholder="Search..." size="14">
</div>
<div id="list"></div>
<script>
const NZ = 'Pacific/Auckland';
let DATA = [], META = {};
const $ = id => document.getElementById(id);
const fmtDate = ms => new Date(ms).toLocaleDateString('en-NZ', {timeZone: NZ, weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'});
function holdings() { return ($('hold').value || '').toUpperCase().split(/[\s,]+/).filter(Boolean); }
function countdown(diff) {
  const m = Math.round(diff / 60000), a = Math.abs(m);
  const d = Math.floor(a / 1440), h = Math.floor((a % 1440) / 60), mm = a % 60;
  const t = d ? `${d}d ${h}h` : (h ? `${h}h ${mm}m` : `${mm}m`);
  return m < 0 ? `${t} ago` : `in ${t}`;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function render() {
  const now = Date.now(), DAY = 86400000, mine = holdings(), mode = $('mode').value, q = $('q').value.toLowerCase();
  const range = +$('range').value, cat = $('cat').value, imp = $('imp').value;
  const evs = DATA.map(e => Object.assign({ms: Date.parse(e.nz_iso)}, e));
  $('sAlert').textContent = evs.filter(e => e.ms >= now && e.ms - now <= DAY).length;
  $('s7').textContent = evs.filter(e => e.ms >= now && e.ms - now <= 7 * DAY).length;
  $('sHigh').textContent = evs.filter(e => e.ms >= now && e.ms - now <= 7 * DAY && e.imp === 'High').length;
  const nxt = evs.find(e => e.ms >= now); $('sNext').textContent = nxt ? countdown(nxt.ms - now).replace('in ', '') : '-';
  const list = evs.filter(e => {
    if (range < 0 ? !(e.ms < now && e.ms >= now + range * DAY) : !(e.ms >= now - 3600000 && e.ms <= now + range * DAY)) return false;
    if (cat && e.cat !== cat) return false;
    if (imp && e.imp !== imp) return false;
    if (mode === 'only' && !(e.tk && mine.includes(e.tk.toUpperCase()))) return false;
    if (mode === 'mine' && e.tk && !mine.includes(e.tk.toUpperCase())) return false;
    if (q && !(e.name + ' ' + e.cat + ' ' + (e.tk || '') + ' ' + (e.sl || '')).toLowerCase().includes(q)) return false;
    return true;
  });
  const out = $('list'); out.replaceChildren();
  if (!list.length) { out.appendChild(el('div', 'empty', 'No events match these filters.')); return; }
  let lastDay = '', shade = false;
  for (const e of list) {
    const first = e.date_nz !== lastDay; if (first) { shade = !shade; lastDay = e.date_nz; }
    const diff = e.ms - now, alert = diff >= 0 && diff <= DAY;
    const row = el('div', 'ev' + (shade ? ' shade' : '') + (first ? ' first' : '') + (alert ? ' alert' : '') + (diff < 0 ? ' past' : ''));
    const when = el('div', 'when');
    when.appendChild(document.createTextNode(first ? fmtDate(e.ms) : ''));
    when.appendChild(el('small', '', e.time_nz ? e.time_nz + ' NZ' : 'All day'));
    when.appendChild(el('span', 'cd', (alert ? 'ALERT ' : '') + countdown(diff)));
    const body = el('div');
    const starred = e.tk && mine.includes(e.tk.toUpperCase());
    const t = el('div', 'title'); if (starred) t.appendChild(el('span', 'star', '\u2605 ')); t.appendChild(document.createTextNode(e.name)); body.appendChild(t);
    const m = el('div', 'meta');
    m.appendChild(el('span', 'chip', e.cat));
    const ic = el('span', 'chip' + (e.imp === 'High' ? ' hi' : ''), e.imp + ' impact'); m.appendChild(ic);
    if (e.tk) m.appendChild(el('span', 'chip', e.tk));
    if (e.sl) m.appendChild(el('span', 'chip', 'Sentiment: ' + e.sl));
    m.appendChild(el('span', 'chip', e.status));
    body.appendChild(m);
    const det = el('details'); det.appendChild(el('summary', '', 'Details'));
    const lines = [['Source time', e.local], ['Higher than expected', e.hm], ['Typical lean', e.lean], ['Also affected', e.aff], ['Sentiment detail', e.sd], ['Notes', e.notes]];
    for (const [k, v] of lines) if (v && v !== 'n/a') { const p = el('div'); p.appendChild(el('b', '', k + ': ')); p.appendChild(document.createTextNode(v)); det.appendChild(p); }
    body.appendChild(det);
    row.appendChild(when); row.appendChild(body); out.appendChild(row);
  }
}
async function init() {
  try {
    const r = await fetch('data/events.json?t=' + Date.now()); if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(); DATA = j.events; META = j.meta;
    $('updated').textContent = 'Data last updated: ' + META.updated_nz + ' \u2022 ' + META.event_count + ' events' + (META.finnhub_key_used ? ' \u2022 earnings dates auto-checked' : '');
    const cats = [...new Set(DATA.map(e => e.cat))].sort();
    for (const c of cats) { const o = el('option', '', c); o.value = c; $('cat').appendChild(o); }
    $('hold').value = localStorage.getItem('holdings') || '';
    render(); setInterval(render, 60000);
  } catch (err) {
    $('updated').textContent = '';
    $('list').appendChild(el('div', 'err', 'Could not load data/events.json (' + err.message + '). If you opened this file directly from your computer, publish it with GitHub Pages instead.'));
  }
}
for (const id of ['range', 'cat', 'imp', 'mode', 'q']) $(id).addEventListener('input', render);
$('hold').addEventListener('input', () => { try { localStorage.setItem('holdings', $('hold').value); } catch (e) {} render(); });
init();
</script>
</body>
</html>
